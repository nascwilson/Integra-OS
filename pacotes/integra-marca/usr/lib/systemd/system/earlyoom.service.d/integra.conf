# iNTEGRA OS: com menos de 4% de RAM e 8% de swap livres, fecha o programa
# que mais consome, nunca a área de trabalho. Programas do Windows e páginas
# de navegador saem primeiro.
[Service]
ExecStart=
ExecStart=/usr/bin/earlyoom -m 4 -s 8 -r 3600 --avoid "^(plasmashell|kwin_wayland|kwin_x11|Xwayland|sddm|sddm-helper|systemd|dbus-daemon|pipewire|wireplumber)$" --prefer "^(wine.*|.*\.exe|QtWebEngineProc|Web Content)$"
