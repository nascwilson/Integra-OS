set default=0
set timeout=5
insmod all_video
insmod gfxterm
set gfxmode=auto
loadfont unicode
terminal_output gfxterm
set lang=pt_BR
set color_normal=light-gray/black
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-cyan

menuentry "Experimentar o iNTEGRA OS" {
    linux  /casper/vmlinuz boot=casper quiet splash locale=pt_BR.UTF-8 keyboard-configuration/layoutcode=br ---
    initrd /casper/initrd
}

menuentry "iNTEGRA OS - modo de vídeo seguro" {
    linux  /casper/vmlinuz boot=casper nomodeset locale=pt_BR.UTF-8 keyboard-configuration/layoutcode=br ---
    initrd /casper/initrd
}

menuentry "Reiniciar" {
    reboot
}
